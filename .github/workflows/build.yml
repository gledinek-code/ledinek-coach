name: Build APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build debug APK
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          gradle assembleDebug --no-daemon
      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk LEDINEK-coach.apk
      - name: Publish to release "latest"
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: LEDINEK coach
          body: Najnovejša različica. Prenesi LEDINEK-coach.apk in ga namesti na telefon.
          files: LEDINEK-coach.apk
          make_latest: true
