<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>LEDINEK coach</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@600&display=swap">
<style>
/* Layout: one-screen app, the whole page takes the phase color; logo top, big clock middle, controls bottom */
:root{
  --idle:#0b0b0c; --work:#2f8a1a; --rest:#c8302f; --done:#0b0b0c;
  --fg:#ffffff; --fg-soft:rgba(255,255,255,.72); --line:rgba(255,255,255,.28); --track:rgba(255,255,255,.22);
  --f-logo:"Archivo Black","Arial Black",Impact,sans-serif;
  --f-body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-num:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --bg:var(--idle);
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);transition:background .25s ease;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body.work{--bg:var(--work)} body.rest{--bg:var(--rest)}
body.idle{--bg:#f2c200;--fg:#0b0b0c;--fg-soft:rgba(11,11,12,.72);--line:rgba(11,11,12,.3);--track:rgba(11,11,12,.18)}
.app{max-width:460px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;padding-block:18px 22px;gap:18px;box-sizing:border-box}
header{display:flex;align-items:baseline;justify-content:center;gap:10px}
.logo{display:inline-block;font-family:var(--f-logo);font-size:30px;letter-spacing:.06em;line-height:1;transform:skewX(-14deg)}
.coach{font-family:var(--f-body);font-weight:500;font-size:16px;letter-spacing:.32em;text-transform:uppercase;color:var(--fg-soft)}
.clock{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:6px;min-height:280px}
#phase{font-weight:600;font-size:20px;letter-spacing:.18em;text-transform:uppercase}
#time{font-family:var(--f-num);font-weight:600;font-size:min(46vw,210px);line-height:.95;font-variant-numeric:tabular-nums}
#round{font-size:17px;color:var(--fg-soft);font-variant-numeric:tabular-nums}
.track{height:8px;background:var(--track);border-radius:4px;overflow:hidden}
#bar{height:100%;width:0;background:var(--fg)}
.actions{display:flex;gap:10px}
button{font-family:var(--f-body);font-size:18px;font-weight:600;color:var(--fg);background:transparent;border:1.5px solid var(--line);border-radius:12px;height:56px;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:active{transform:scale(.98)}
button:focus-visible{outline:2px solid var(--fg);outline-offset:2px}
#start{flex:1.4;background:var(--fg);color:var(--bg);border-color:var(--fg)}
#reset{flex:1}
.settings{display:grid;gap:0;border-top:1px solid var(--line)}
.row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.row .l{flex:1;font-size:16px;color:var(--fg-soft)}
.row button{width:52px;height:46px;font-size:24px;padding:0}
.row .v{min-width:72px;text-align:center;font-family:var(--f-num);font-size:24px;font-variant-numeric:tabular-nums}
.locked .row button{opacity:.35}
@media (prefers-reduced-motion:reduce){body{transition:none}}
</style>

</head><body>
<div class="app">
  <header><span class="logo">LEDINEK</span><span class="coach">coach</span></header>

  <section class="clock" aria-live="polite">
    <div id="phase">Get ready</div>
    <div id="time">5</div>
    <div id="round">Round 0 / 6</div>
  </section>

  <div class="track"><div id="bar"></div></div>

  <div class="actions">
    <button id="start" type="button">Start</button>
    <button id="reset" type="button">Reset</button>
  </div>

  <div class="settings" id="settings">
    <div class="row"><span class="l">Workout</span><button type="button" id="w-" data-k="w" data-d="-5" aria-label="Less workout time">−</button><span class="v" id="vw">30 s</span><button type="button" id="w+" data-k="w" data-d="5" aria-label="More workout time">+</button></div>
    <div class="row"><span class="l">Rest</span><button type="button" id="r-" data-k="r" data-d="-5" aria-label="Less rest time">−</button><span class="v" id="vr">30 s</span><button type="button" id="r+" data-k="r" data-d="5" aria-label="More rest time">+</button></div>
    <div class="row"><span class="l">Rounds</span><button type="button" id="n-" data-k="n" data-d="-1" aria-label="Fewer rounds">−</button><span class="v" id="vn">6</span><button type="button" id="n+" data-k="n" data-d="1" aria-label="More rounds">+</button></div>
  </div>
</div>
<video id="ns" muted playsinline loop style="position:absolute;width:1px;height:1px;opacity:0;pointer-events:none"></video>

<script>
const PRE=5;
let cfg={w:30,r:30,n:6};
try{const s=JSON.parse(localStorage.getItem('lc-cfg')||'null');if(s&&s.w&&s.r&&s.n)cfg=s;}catch(e){}
let ctx,timer=null,seq=[],idx=0,endAt=0,remain=0,paused=false,lock=null,cv,drawI,lastSec=-1;
const $=id=>document.getElementById(id);
const fmt=s=>s>=60?Math.floor(s/60)+':'+String(s%60).padStart(2,'0'):s+' s';
function save(){try{localStorage.setItem('lc-cfg',JSON.stringify(cfg));}catch(e){}}
function upd(){$('vw').textContent=fmt(cfg.w);$('vr').textContent=fmt(cfg.r);$('vn').textContent=cfg.n;if(!timer&&!paused)show('idle',PRE,0,0);}
document.querySelectorAll('#settings button').forEach(b=>b.addEventListener('click',()=>{
  if(timer||paused)return;const k=b.dataset.k,d=+b.dataset.d;const lim={w:[5,600],r:[1,600],n:[1,50]}[k];
  let v=cfg[k];
  if(k==='r'){v=d>0?(v<5?v+1:v+5):(v>5?Math.max(5,v-5):v-1);}else v+=d;
  cfg[k]=Math.min(lim[1],Math.max(lim[0],v));save();upd();}));
function beep(f,d){if(!ctx)return;const o=ctx.createOscillator(),g=ctx.createGain();o.frequency.value=f;o.type='square';
  g.gain.setValueAtTime(0.25,ctx.currentTime);g.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+d);
  o.connect(g).connect(ctx.destination);o.start();o.stop(ctx.currentTime+d);}
function build(){seq=[{t:'pre',d:PRE,r:0}];for(let r=1;r<=cfg.n;r++){seq.push({t:'work',d:cfg.w,r});seq.push({t:'rest',d:cfg.r,r});}seq.pop();}
const lab={idle:'Get ready',pre:'Get ready',work:'Workout',rest:'Rest',done:'Done'};
function show(k,sec,r,frac){document.body.className=(k==='work'||k==='rest'||k==='idle')?k:'';
  $('phase').textContent=lab[k];$('time').textContent=sec;$('round').textContent='Round '+r+' / '+cfg.n;$('bar').style.width=(frac*100)+'%';}
function tick(){const s=seq[idx];const left=Math.max(0,endAt-performance.now())/1000;const sec=Math.ceil(left);
  if(sec!==lastSec){lastSec=sec;if(s.t==='pre'&&sec>0)beep(660,0.15);else if(s.t!=='pre'&&sec>0&&sec<=3)beep(660,0.1);}
  show(s.t,sec,s.r,1-left/s.d);
  if(left<=0){idx++;lastSec=-1;
    if(idx>=seq.length){beep(880,0.4);setTimeout(()=>beep(880,0.4),500);setTimeout(()=>beep(1100,0.8),1000);stop();lockSet(false);show('done',0,cfg.n,1);return;}
    beep(seq[idx].t==='work'?1100:880,0.7);endAt=performance.now()+seq[idx].d*1000;}}
async function wake(){try{lock=await navigator.wakeLock.request('screen');}catch(e){}
  try{if(!cv){cv=document.createElement('canvas');cv.width=cv.height=2;$('ns').srcObject=cv.captureStream(1);}
    const c=cv.getContext('2d');let f=0;clearInterval(drawI);drawI=setInterval(()=>{c.fillStyle=(f++%2)?'#000':'#010101';c.fillRect(0,0,2,2);},500);await $('ns').play();}catch(e){}}
function unwake(){try{lock&&lock.release();lock=null;}catch(e){}clearInterval(drawI);try{$('ns').pause();}catch(e){}}
document.addEventListener('visibilitychange',()=>{if(timer&&document.visibilityState==='visible')wake();});
function lockSet(on){$('settings').classList.toggle('locked',on);}
function stop(){clearInterval(timer);timer=null;$('start').textContent='Start';unwake();}
$('start').addEventListener('click',()=>{
  try{if(!ctx)ctx=new(window.AudioContext||window.webkitAudioContext)();ctx.resume();}catch(e){}
  if(timer){remain=endAt-performance.now();stop();paused=true;$('start').textContent='Resume';return;}
  if(paused){endAt=performance.now()+remain;paused=false;}else{build();idx=0;lastSec=-1;endAt=performance.now()+PRE*1000;}
  lockSet(true);wake();timer=setInterval(tick,100);$('start').textContent='Pause';tick();});
$('reset').addEventListener('click',()=>{stop();paused=false;idx=0;lockSet(false);show('idle',PRE,0,0);});
upd();
</script>

</body></html>
